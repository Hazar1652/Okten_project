services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: configs.settings.production
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 configs.wsgi:application"

  nginx:
    build:
      context: .
      dockerfile: infra/Dockerfile.nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - media_data:/app/media:ro

volumes:
  media_data:
